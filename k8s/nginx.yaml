apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: cicd-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: cicd-sandbox
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 19302      # 集群内访问端口
      targetPort: 80
      nodePort: 19302  # 👇 物理机对外暴露端口 (宿主机访问: 19302)
  type: NodePort
