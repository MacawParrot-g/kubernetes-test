apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: k8s-test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: k8s-test-env
data:
  default.conf: |
    server {
        listen 80;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /api {
            proxy_pass http://backend:8085;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: k8s-test-env
spec:
  selector:
    app: nginx
  ports:
    - port: 19302
      targetPort: 80
      nodePort: 19302  # 宿主机访问端口
  type: NodePort
