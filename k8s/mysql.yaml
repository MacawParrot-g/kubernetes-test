apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: k8s-test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root_password"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
      volumes:
      - name: mysql-data
        hostPath:
          path: /opt/k8s-data/mysql
          type: DirectoryOrCreate
      - name: init-script
        configMap:
          name: mysql-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: k8s-test-env
spec:
  selector:
    app: mysql
  ports:
    - port: 3304
      targetPort: 3306
      nodePort: 13304  # 宿主机访问端口
  type: NodePort
