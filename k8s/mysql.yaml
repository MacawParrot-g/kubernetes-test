apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: cicd-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root_password" # 设置 root 密码
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        # 👇 关键修改：挂载初始化脚本到 Docker 镜像的 docker-entrypoint-initdb.d 目录
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
      volumes:
      - name: mysql-data
        hostPath:
          path: /opt/k8s-data/mysql
          type: DirectoryOrCreate
      # 使用 ConfigMap 存储初始化 SQL 脚本
      - name: init-script
        configMap:
          name: mysql-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: cicd-sandbox
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3304       # 集群内访问端口
      targetPort: 3306
      nodePort: 13304  # 👇 物理机对外暴露端口 (宿主机访问: 13304)
  type: NodePort
