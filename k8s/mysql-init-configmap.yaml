apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-sql
  namespace: k8s-test-env
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS test_data;
    CREATE USER IF NOT EXISTS 'remote_user'@'%' IDENTIFIED BY '12345678';
    GRANT ALL PRIVILEGES ON test_data.* TO 'remote_user'@'%';
    FLUSH PRIVILEGES;
