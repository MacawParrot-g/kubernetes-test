apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: k8s-test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "admin"
        - name: RABBITMQ_DEFAULT_PASS
          value: "91781369"
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: k8s-test-env
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5173
      targetPort: 5672
      nodePort: 15173  # 宿主机访问端口
  type: NodePort
