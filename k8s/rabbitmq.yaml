apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: cicd-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672 # RabbitMQ 管理面板
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: cicd-sandbox
spec:
  selector:
    app: rabbitmq
  ports:
    - protocol: TCP
      port: 5173       # 集群内 AMQP 协议访问端口
      targetPort: 5672
      nodePort: 15173  # 👇 物理机对外暴露端口 (宿主机访问: 15173)
  type: NodePort
