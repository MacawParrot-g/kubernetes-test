spring:
  rabbitmq:
    host: rabbitmq  # 【修改1】使用 K8s Service 名称
    port: 5672
    username: admin
    password: 91781369
    virtual-host: /
    # ... 其他 rabbitmq 配置保持不变 ...
  data:
    redis:
      host: redis   # 【修改2】使用 K8s Service 名称
      port: 6379
      database: 1
      timeout: 3000ms
  datasource:
    url: jdbc:mysql://mysql:3304/test_data?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false # 【修改3】使用 K8s Service 名称和端口
    username: remote_user  # 【修改4】使用我们刚才初始化的用户
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ... hikari 配置保持不变 ...
  lifecycle:
    timeout-per-shutdown-phase: 25s # 【修改5】比 K8s 默认 30s 少 5 秒

server:
  port: 8085  # 【修改6】与 K8s 暴露端口对齐
  shutdown: graceful
  # ... 其他 server 配置保持不变 ...

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true  # 【修改7】开启 K8s 探针
  health:
    livenessstate:
      enabled: true    # 【修改8】存活探针
    readinessstate:
      enabled: true    # 【修改9】就绪探针
    rabbit:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    org.example: INFO
    org.springframework.amqp: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{username}] %-5level %logger{36} - %msg%n"
  # 【修改10】删除了 file.name 配置，强制日志输出到控制台，交由 K8s 收集
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
